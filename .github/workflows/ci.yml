name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: build and smoke test
        run: make build && ./bin/proctab -v

  cross:
    name: build linux/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm, "386", riscv64, ppc64le, s390x, loong64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: go build -trimpath -ldflags "-s -w" -o proctab ./cmd/proctab && ls -l proctab

  snapshot:
    name: goreleaser snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: build wheels + apt/pip site (unsigned)
        run: |
          python3 packaging/build_wheels.py --version v0.0.0-next --dist dist --out wheels
          bash packaging/build_site.sh dist wheels site
      - name: pip install from the built index
        run: |
          (cd site && python3 -m http.server 8765 &) && sleep 1
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install proctab --index-url http://localhost:8765/simple/
          /tmp/venv/bin/proctab -v
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/checksums.txt
            wheels/*.whl
          retention-days: 7

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
